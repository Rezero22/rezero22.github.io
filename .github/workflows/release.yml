name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A702E7: ${{ secrets.A702E7 }}
          BBDAE6: ${{ secrets.BBDAE6 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A702E7', '')
          meta_b = os.environ.get('BBDAE6', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 2a6be67298fe85f452e6bf156a -->', meta_a)
          if meta_b:
              out = out.replace('<!-- d74ea66f067e30df359b -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
